      - text: "Como Funciona"
        menu:
          - text: "Visão Geral"
            href: como-funciona.html
          - text: "Credencial Verificável"
            href: credencial-verificavel.html
          - text: "Comprovar Idade sem Revelar Identidade"
            href: comprovar-idade.html
          - text: "Jornada do Usuário"
            href: jornada-usuario.html
          - text: "Perguntas Frequentes"
            href: faq.html
      
    right:
      - icon: github
        href: https://github.com/infraestrutura-digital/idade-website

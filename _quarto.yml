  site-url: https://idade.infraestrutura.digital

  navbar:
    background: "#071D41"
    foreground: "white"
    left:
      - text: "Para o Cidadão"
        href: cidadao.md
      - text: "Para os Negócios"
        href: negocio.md
      - text: "Para Desenvolvedores"
